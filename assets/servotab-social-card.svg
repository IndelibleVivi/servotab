<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="social-title social-desc" lang="en">
  <title id="social-title">Servotab — Method as exponent, not machinery</title>
  <desc id="social-desc">A warm paper editorial card for Servotab with the blue raised-tab mark, quiet work-surface geometry, and the product promise: clear work stays direct, risk brings method, and fresh evidence closes.</desc>
  <style>
    .sans { font-family: "Inter Display", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .operator { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
    .mono { font-family: SFMono-Regular, "Cascadia Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace; }
    .hairline { vector-effect: non-scaling-stroke; }
  </style>
  <defs>
    <!-- Exact fixed-color projection of the canonical 64x64 Servotab mark. -->
    <g id="servotab-mark-projection" fill="#315EFB">
      <path d="M33.872 43.32c0-6.552-11.704-5.992-11.704-9.8 0-1.792 1.96-3.304 4.592-3.304 1.96 0 3.472 3.192 6.104 3.192 2.072 0 3.864-2.128 3.864-3.416 0-2.464-6.216-3.192-8.12-3.192-10.248 0-13.216 5.096-13.216 8.512 0 6.384 11.816 6.44 11.816 10.024 0 1.232-1.512 3.864-6.328 3.864-2.072 0-3.696-3.36-6.496-3.36-2.352 0-3.864 2.016-3.864 3.36 0 2.744 6.272 3.36 8.568 3.36 12.768 0 14.784-5.544 14.784-9.24Z"/>
      <path transform="translate(33 29) scale(.029 -.029)" d="M415 73 368 111C326 67 305 51 281 51C251 51 242 71 242 95C242 120 251 149 256 168L313 379H392L458 440H329L354 534C363 569 377 586 394 600C278 600 268 443 181 440L115 379H192L130 149C125 131 122 113 122 96C122 36 158-10 244-10C310-10 353 12 415 73Z"/>
    </g>
  </defs>

  <g id="paper">
    <rect width="1200" height="630" fill="#FAF9F5"/>
    <path class="hairline" d="M760 0V630M910 0V630M1060 0V630" stroke="#D9DDD7" stroke-width="1"/>
  </g>

  <g id="identity" data-readability-background="#FAF9F5">
    <text class="mono" x="72" y="70" fill="#315EFB" font-size="22" font-weight="650" letter-spacing="1.3" data-readability="supporting">SERVOTAB / CODEX ENGINEERING METHODS</text>
    <text class="sans" x="68" y="238" fill="#151922" font-size="96" font-weight="760" letter-spacing="-5" data-readability="critical">Servotab</text>
    <text class="operator" x="74" y="310" fill="#151922" font-size="39" font-style="italic" font-weight="600" data-readability="critical">Method as exponent, not machinery.</text>
    <text class="sans" x="74" y="386" fill="#667080" font-size="24" font-weight="500" data-readability="body">Quiet, risk-scaled engineering methods for Codex.</text>
  </g>

  <g id="method-surface">
    <rect x="800" y="142" width="322" height="274" fill="#FFFFFF" stroke="#151922" stroke-width="2"/>
    <rect x="1014" y="111" width="108" height="72" fill="#315EFB"/>
    <text class="operator" x="1068" y="160" fill="#FFFFFF" font-size="38" font-style="italic" font-weight="700" text-anchor="middle" data-readability="critical" data-readability-background="#315EFB">t</text>
    <g transform="translate(844 190) scale(2.0625)">
      <use href="#servotab-mark-projection"/>
    </g>
    <text class="mono" x="961" y="360" fill="#667080" font-size="21" text-anchor="middle" data-readability="supporting" data-readability-background="#FFFFFF">METHOD / LOCAL PRESSURE</text>
    <path class="hairline" d="M800 448H1122" stroke="#151922" stroke-width="1"/>
    <circle cx="1108" cy="448" r="7" fill="#287A4B"/>
    <text class="mono" x="800" y="490" fill="#287A4B" font-size="22" font-weight="650" data-readability="supporting" data-readability-background="#FAF9F5">FRESH EVIDENCE / SETTLED</text>
  </g>

  <g id="promise-rail" data-readability-background="#FAF9F5">
    <path class="hairline" d="M72 532H1122" stroke="#151922" stroke-width="1"/>
    <text class="mono" x="72" y="582" fill="#667080" font-size="22" data-readability="supporting">CLEAR WORK STAYS DIRECT</text>
    <text class="mono" x="438" y="582" fill="#667080" font-size="22" data-readability="supporting">RISK BRINGS METHOD</text>
    <text class="mono" x="744" y="582" fill="#667080" font-size="22" data-readability="supporting">FRESH EVIDENCE CLOSES</text>
  </g>
</svg>
