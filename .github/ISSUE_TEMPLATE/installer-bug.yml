name: Installer bug
description: Report install, update, uninstall, rollback, manifest, or skill-root problems.
title: "[Installer] "
body:
  - type: markdown
    attributes:
      value: |
        The installer is transactional and should restore prior state on failure. Please do not delete manifests, backups, or snapshots before reporting a bug.

  - type: input
    id: version
    attributes:
      label: Softpowers version or commit
      placeholder: 0.2.0-rc4 or the output of git rev-parse --short HEAD
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, shell, and Python version
      placeholder: macOS 15.6, zsh 5.9, Python 3.13.3
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Fresh install
        - Upgrade
        - Reinstall
        - Uninstall or rollback
        - Custom destination
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Replace personal paths with placeholders and remove environment values.
      render: shell
      placeholder: ./install.sh
    validations:
      required: true

  - type: textarea
    id: roots
    attributes:
      label: Relevant skill roots before the operation
      description: Say whether Softpowers already existed in ~/.agents/skills, legacy ~/.codex/skills, or a custom --dest. Do not paste unrelated directory listings.
      placeholder: Softpowers existed only in ~/.agents/skills.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed result and redacted error output
      description: Include the full relevant error, but remove private paths, usernames, tokens, and unrelated content.
      render: shell
    validations:
      required: true

  - type: textarea
    id: state
    attributes:
      label: State after failure
      description: Did prior skills return? Is .softpowers-current-manifest present? Are backups or snapshots present? Do not modify them just to answer.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed secrets, account details, private source, personal absolute paths, local notes, and full private Codex transcripts from this issue.
          required: true
