name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Audit public tree
        run: python scripts/audit_public_tree.py

  site-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: site

      - name: Test website behavior
        run: npm test
        working-directory: site

      - name: Build website
        run: npm run build
        working-directory: site

      - name: Retain built site for source-bound review
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: servotab-site
          path: site/dist/
          retention-days: 7
          if-no-files-found: error

  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned maintainer dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check generated skills
        run: |
          python scripts/build_skills.py --check
          python scripts/validate_sync.py

      - name: Validate release payload
        run: |
          python scripts/validate.py plugins/servotab/skills
          python scripts/generate_pack_manifest.py --check

      - name: Run packaging self-test
        run: python scripts/selftest.py

      - name: Run deterministic release regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -q

      - name: Check script syntax
        run: python -m py_compile scripts/*.py

  release-artifacts:
    if: github.event_name == 'push'
    needs: [public-tree, site-build, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned maintainer dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and verify exact-source release assets
        run: |
          python scripts/build_release.py --output dist/release
          python scripts/build_release.py --output dist/release --check

      - name: Retain release preparation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: servotab-release
          path: dist/release/*
          retention-days: 14
          if-no-files-found: error
