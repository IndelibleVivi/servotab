name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Audit public tree
        run: python scripts/audit_public_tree.py

  site-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: site

      - name: Test website behavior
        run: npm test
        working-directory: site

      - name: Build website
        run: npm run build
        working-directory: site

  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install maintainer dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Check generated skills
        run: |
          python scripts/build_skills.py --check
          python scripts/validate_sync.py

      - name: Validate release payload
        run: |
          python scripts/validate.py plugins/servotab/skills
          python scripts/generate_pack_manifest.py --check

      - name: Run packaging self-test
        run: python scripts/selftest.py

      - name: Check script syntax
        run: python -m py_compile scripts/*.py
